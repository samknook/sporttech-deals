<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaceAtlas — meetcontrole</title><style>:root{font-family:system-ui,sans-serif;background:#f6f8f5;color:#14332b}body{max-width:680px;margin:8vh auto;padding:22px}main{background:white;padding:27px;border:1px solid #d7e4dd;border-radius:16px}h1{margin-top:0}button{padding:13px 22px;border:0;border-radius:9px;background:#173d2c;color:white;font-weight:750;cursor:pointer}#result{margin-top:16px;padding:14px;background:#eef2ed;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#216342}p{line-height:1.6}</style></head><body><main><a href="./">← RaceAtlas</a><h1>Meetcontrole</h1><p>Deze technische controle meet één testweergave. Er wordt geen persoonlijke informatie opgeslagen in onze rapporten.</p><p id="scriptStatus">Meetcode controleren...</p><button type="button" id="check">Controleer verbinding met meetfunctie</button><div id="result" role="status" aria-live="polite">Nog niet getest.</div></main><script src="tracking.js?v=20261112-traffic1" defer></script><script>
const result=document.getElementById('result'),status=document.getElementById('scriptStatus');
window.addEventListener('load',()=>{status.textContent='Meetcode: '+(window.RaceAtlasTracking?.enabled()?'geladen en op productie ingeschakeld':'niet beschikbaar of niet op productiedomein');});
document.getElementById('check').onclick=async()=>{
 result.textContent='Verzoek versturen...';
 try{
  const response=await fetch('https://lpzndnxloykcthbsqcet.supabase.co/functions/v1/raceatlas-track-outbound',{
   method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},
   body:JSON.stringify({eventId:'ra-site',kind:'site_view'}),cache:'no-store',
   signal:AbortSignal.timeout(12000)
  });
  let responseBody='';try{responseBody=await response.text()}catch{}
  result.textContent=response.status===202
   ?'✅ Verbinding geslaagd (HTTP 202). Eén testweergave is naar de database aangeboden.'
   :'❌ Meetfunctie antwoordde met HTTP '+response.status+'. '+responseBody.slice(0,180);
 }catch(error){result.textContent='❌ Verbinding mislukt. '+(error?.message||String(error))+' — Controleer browserbeveiliging, blokkering of de publicatie.'}
};
</script></body></html>
