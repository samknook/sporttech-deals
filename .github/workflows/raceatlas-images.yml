name: Publish RaceAtlas image batches
on:
  push:
    branches: [main]
    paths:
      - 'raceatlas-assets/batch*.zip'
      - '.github/workflows/raceatlas-images.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: raceatlas-images
  cancel-in-progress: false
jobs:
  install-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://samknook.github.io/sporttech-deals/raceatlas/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and validate RaceAtlas event images
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, zipfile
          from pathlib import Path
          import hashlib

          root=Path('docs/raceatlas/images/featured')
          root.mkdir(parents=True, exist_ok=True)
          packs=sorted(Path('raceatlas-assets').glob('batch*.zip'))
          if not packs:
              raise SystemExit('No RaceAtlas image batches available')
          images={}
          for pack in packs:
              with zipfile.ZipFile(pack) as archive:
                  files=[n for n in archive.namelist() if n.endswith('.webp')]
                  if len(files)!=10:
                      raise ValueError(f'{pack} must contain exactly 10 WebP files, found {len(files)}')
                  for filename in files:
                      expected=re.fullmatch(r'docs/raceatlas/images/featured/(ra-\d+\.webp)',filename)
                      if not expected:
                          raise ValueError(f'Unexpected image path: {filename}')
                      key=expected.group(1)
                      if key in images:
                          raise ValueError(f'Duplicate event image: {key}')
                      data=archive.read(filename)
                      if data[:4]!=b'RIFF' or data[8:12]!=b'WEBP' or len(data)<10000:
                          raise ValueError(f'Invalid WebP: {filename}')
                      images[key]=data
          if len({hashlib.sha256(data).digest() for data in images.values()})!=len(images):
              raise ValueError('Identical image payloads found across event IDs')
          for key,data in images.items():
              (root/key).write_bytes(data)
              print(f'Validated {key}: {len(data)} bytes')
          index=Path('docs/raceatlas/index.html').read_text()
          for key in images:
              if ('"id":"'+key.removesuffix('.webp')+'"') not in index:
                  raise ValueError(f'Event ID for image not found in catalogue: {key}')
          print(f'Validated {len(images)} images in {len(packs)} batches')
          PY
      - name: Commit images into site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/raceatlas/images/featured/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated RaceAtlas event images"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy RaceAtlas and full website
        uses: actions/deploy-pages@v4
