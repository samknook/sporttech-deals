name: TriZentro native app prototype
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'docs/raceatlas/index.html'
      - 'docs/trizentro-app-mark.svg'
      - '.github/workflows/trizentro-native-app.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Validate packaged web bundle
        run: |
          test -f www/main.js
          test -f android/app/src/main/assets/public/catalogue.json
          test -f android/app/src/main/assets/public/logo.svg
          test -f android/app/src/main/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: trizentro-mobile-web-preview
          path: mobile/www
  android-debug:
    needs: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm run android:init
      - name: Apply TriZentro launcher icons
        run: node brand-android.mjs
      - name: Build Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK identity and signature
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee /tmp/trizentro-apk-info.txt
          grep -Fq "package: name='com.trizentro.app'" /tmp/trizentro-apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: trizentro-android-debug
          if-no-files-found: error
          path: mobile/android/app/build/outputs/apk/debug/*.apk
