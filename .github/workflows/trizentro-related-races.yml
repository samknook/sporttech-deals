name: TriZentro related race discovery
on:
  pull_request:
    paths:
      - 'scripts/build-trizentro-event-pages.cjs'
      - 'tests/trizentro-related-races.test.cjs'
      - '.github/workflows/trizentro-related-races.yml'
  workflow_dispatch:
jobs:
  related-events:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/trizentro-related-races.test.cjs
