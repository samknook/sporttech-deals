name: MKB AI Studio prototype tests
on:
  push:
    paths:
      - 'docs/ai-studio/**'
      - 'ventures/mkb-ai-studio/api-pilot/**'
      - 'tests/test-mkb-ai-*.js'
      - '.github/workflows/mkb-ai-studio-tests.yml'
  pull_request:
    paths:
      - 'docs/ai-studio/**'
      - 'ventures/mkb-ai-studio/api-pilot/**'
      - 'tests/test-mkb-ai-*.js'
      - '.github/workflows/mkb-ai-studio-tests.yml'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Inbox
        run: node tests/test-mkb-ai-studio.js
      - name: Test Inbox Review Workflow
        run: node tests/test-mkb-ai-inbox-workflow.js
      - name: Test offline-first API pilot
        run: node tests/test-mkb-ai-api-pilot.js
      - name: Test conservative draft claim screening
        run: node tests/test-mkb-ai-claims.js
      - name: Test structured evidence comparison
        run: node tests/test-mkb-ai-source-evidence.js
      - name: Test integrated inbox review pipeline
        run: node tests/test-mkb-ai-review-pipeline.js
      - name: Test batch pilot metrics and review boundaries
        run: node tests/test-mkb-ai-batch-evaluation.js
      - name: Test model-to-review batch integration (mocked API)
        run: node tests/test-mkb-ai-model-batch.js
      - name: Detect unlinked claims in drafts
        run: node tests/test-mkb-ai-claim-coverage.js
      - name: Execute offline mock model batch demo
        run: node ventures/mkb-ai-studio/api-pilot/model-batch-demo.cjs
      - name: Test net pilot task measurements
        run: node tests/test-mkb-ai-measure.js
      - name: Run fictional batch evaluation example
        run: node ventures/mkb-ai-studio/api-pilot/batch-demo.cjs
      - name: Test evidence demo consistency
        run: node tests/test-mkb-ai-evidence-demo.js
      - name: Test QuickScan
        run: node tests/test-mkb-ai-studio-quickscan.js
      - name: Test Pilot Intake
        run: node tests/test-mkb-ai-pilot-intake.js
      - name: Test Package Scopes
        run: node tests/test-mkb-ai-offer.js
      - name: Verify Public/Private Boundary
        run: node tests/test-mkb-ai-public-boundary.js
