name: RaceAtlas bronnen controleren
on:
  schedule:
    - cron: '21 6 * * 2'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer evenementdatabase en JavaScript
        run: node --test tests/raceatlas*.test.cjs
      - name: Controleer openbare bronlinks (niet de wedstrijddatums)
        run: python scripts/raceatlas_check_sources.py
      - name: Publiceer statusrapport
        run: |
          git config user.name "raceatlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/raceatlas/source-health.json
          if ! git diff --cached --quiet; then
            git commit -m "RaceAtlas: update bronlink-status"
            git push
          fi
