name: Test prijsvergelijker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q app tests
      - name: Scanner- en veiligheidstests
        run: python -m unittest discover -s tests -v
      - name: JSON valideren
        run: |
          python -m json.tool config/catalog.json > /dev/null
          python -m json.tool config/settings.json > /dev/null
          python -m json.tool site/data.json > /dev/null
