name: Refresh RaceAtlas staging preview
on:
  push:
    branches: [raceatlas-staging]
    paths:
      - 'docs/raceatlas/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Request preview refresh through main Pages workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-site.yml --repo samknook/sporttech-deals --ref main
