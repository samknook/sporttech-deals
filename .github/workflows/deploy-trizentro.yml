name: Deploy TriZentro website (docs)
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tests/*.test.cjs'
      - '.github/workflows/deploy-trizentro.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "trizentro-pages"
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website and tests
        uses: actions/checkout@v4
      - name: Install Node for offline regression checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run TriZentro checks before deployment
        run: node --test tests/*.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload exactly the public docs directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy public TriZentro site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public homepage after deployment
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Checking public homepage at ${PUBLIC_URL}"
          # A deployment can finish slightly before edge caches return new files.
          success=0
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error --max-time 20 "${PUBLIC_URL}" -o /tmp/trizentro-home.html; then
              if grep -qi 'TRIZENTRO' /tmp/trizentro-home.html && grep -q 'translations-bundle.js' /tmp/trizentro-home.html; then
                success=1
                break
              fi
              echo "HTTP was successful but expected TriZentro content was absent."
            else
              echo "Homepage request failed on attempt ${attempt}."
            fi
            sleep 10
          done
          if [ "${success}" != 1 ]; then
            echo "::error::GitHub Pages deployment completed but the public TriZentro homepage was not verified."
            exit 1
          fi
          echo "Public TriZentro homepage verified."
