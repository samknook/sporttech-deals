name: Deploy TriZentro website (docs)
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tests/*.test.cjs'
      - '.github/workflows/deploy-trizentro.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "trizentro-pages"
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website and tests
        uses: actions/checkout@v4
      - name: Install Node for offline regression checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run TriZentro checks before deployment
        run: node --test tests/*.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload exactly the public docs directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy public TriZentro site
        id: deployment
        uses: actions/deploy-pages@v4
