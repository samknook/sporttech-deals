name: Controleer Google Search Console-verificatie live

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/google36c6913874a61b33.html'
      - '.github/workflows/google-verification-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-google-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Controleer homepage en HTML-verificatiebestand op live GitHub Pages
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          base = 'https://samknook.github.io/sporttech-deals/'
          checks = {
              base: [
                  '<meta name="google-site-verification" content="hMpAY4xSz1BBjiImUwCtvE_1hKk0XD56l4AEnsk7W14" />',
                  '<meta name="3045ec1a300a1b5" content="e43119facc31c6d54302cec101a02834" />',
              ],
              base + 'google36c6913874a61b33.html': [
                  'google-site-verification: google36c6913874a61b33.html',
              ],
          }
          for attempt in range(1, 10):
              problems = []
              for url, fragments in checks.items():
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'TriZentroGoogleVerificationCheck/1.0'})
                      with urllib.request.urlopen(req,timeout=15) as response:
                          assert response.status == 200, f'HTTP {response.status}'
                          body=response.read(200000).decode('utf-8')
                      for fragment in fragments:
                          if fragment not in body:
                              problems.append(f'{url}: expected verification token missing')
                  except Exception as exc:
                      problems.append(f'{url}: {type(exc).__name__}: {exc}')
              if not problems:
                  print('PASS: Google-metatag, Google HTML-file en Daisycon-tag zijn via de openbare website bereikbaar.')
                  break
              print(f'Attempt {attempt}: {problems}')
              if attempt == 9:
                  raise SystemExit('Google verification website check failed')
              time.sleep(8)
          PY
