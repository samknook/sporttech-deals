name: Publish TriZentro live (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - 'scripts/build-trizentro-event-pages.cjs'
      - 'scripts/build-trizentro-platform-shell.cjs'
      - 'scripts/build-trizentro-organizer-report.cjs'
      - 'scripts/build-trizentro-organizer-dashboard.cjs'
      - 'tests/test-trizentro-organizer-report.cjs'
      - 'tests/test-trizentro-organizer-dashboard.cjs'
      - 'tests/test-trizentro-admin-analytics.cjs'
      - 'scripts/prepare-trizentro-domain.cjs'
      - 'config/trizentro-public-pages.json'
      - '.github/trizentro-domain.json'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate event detail pages
        run: node scripts/build-trizentro-event-pages.cjs
      - name: Generate centralized public shell and clean routes
        run: node scripts/build-trizentro-platform-shell.cjs
      - name: Verify publishable website
        run: |
          node --check docs/shared-ui.js
          node --check docs/season-dashboard.js
          node --check docs/account-profile.js
          test -s docs/account-profile.html
          node --check docs/raceatlas/details.js
          node --check docs/raceatlas/intelligence.js
          node --check docs/raceatlas/alerts.js
          node --check docs/raceatlas/event-save.js
          node tests/test-trizentro-ironman-links.cjs
          node tests/test-trizentro-seo.cjs
          node tests/test-trizentro-registration-radar.cjs
          node tests/test-trizentro-event-save.cjs
          node tests/test-trizentro-season-dashboard.cjs
          node tests/test-trizentro-cloud-season.cjs
          node tests/test-trizentro-status-writes.cjs
          node tests/test-trizentro-organizer-report.cjs
          node tests/test-trizentro-organizer-dashboard.cjs
          node tests/test-trizentro-admin-analytics.cjs
          test -s docs/admin/analytics/index.html
          test -s docs/index.html
          test -s docs/events/index.html
          test -s docs/performance/index.html
          test -s docs/seizoen/index.html
          test -s docs/account/index.html
          test -s docs/organisatoren/index.html
      - name: Check extended layout assertions (non-blocking)
        continue-on-error: true
        run: node tests/test-trizentro-platform-shell.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live public routes and analytics login page
        run: |
          set -euo pipefail
          for route in events seizoen performance account organisatoren admin/analytics; do
            echo "Checking /$route/"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "https://trizentro.com/$route/" > /tmp/trizentro-live-route.html
            test -s /tmp/trizentro-live-route.html
          done
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "https://trizentro.com/admin/analytics/" | grep -q 'trizentro-admin-analytics'

