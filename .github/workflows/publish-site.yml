name: Publish TriZentro live (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-trizentro-event-pages.cjs'
      - 'scripts/build-trizentro-platform-shell.cjs'
      - 'scripts/prepare-trizentro-domain.cjs'
      - 'config/trizentro-public-pages.json'
      - '.github/trizentro-domain.json'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate event detail pages
        run: node scripts/build-trizentro-event-pages.cjs
      - name: Generate centralized public shell and clean routes
        run: node scripts/build-trizentro-platform-shell.cjs
      - name: Verify publishable website
        run: |
          node --check docs/shared-ui.js
          node --check docs/season-dashboard.js
          node --check docs/account-profile.js
          test -s docs/account-profile.html
          node --check docs/raceatlas/details.js
          node tests/test-trizentro-ironman-links.cjs
          test -s docs/index.html
          test -s docs/events/index.html
          test -s docs/performance/index.html
          test -s docs/seizoen/index.html
          test -s docs/account/index.html
          test -s docs/organisatoren/index.html
      - name: Check extended layout assertions (non-blocking)
        continue-on-error: true
        run: node tests/test-trizentro-platform-shell.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
