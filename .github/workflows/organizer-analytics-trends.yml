name: TriZentro organizer analytics trends
on:
  pull_request:
    paths:
      - 'docs/raceatlas/organizer-dashboard.*'
      - 'tests/organizer-analytics-trends.test.cjs'
      - '.github/workflows/organizer-analytics-trends.yml'
  workflow_dispatch:
jobs:
  organizer-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/organizer-analytics-trends.test.cjs
