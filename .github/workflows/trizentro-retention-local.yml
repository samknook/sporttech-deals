name: TriZentro retention, conversion, and local races
on:
  pull_request:
    paths:
      - 'docs/raceatlas/index.html'
      - 'docs/raceatlas/tracking.js'
      - 'docs/raceatlas/event-save.js'
      - 'docs/raceatlas/organizer-review-admin.*'
      - 'scripts/build-trizentro-event-pages.cjs'
      - 'supabase/functions/raceatlas-track-outbound/index.ts'
      - 'supabase/functions/trizentro-organizer-review-admin/index.ts'
      - 'tests/trizentro-retention-local.test.cjs'
      - '.github/workflows/trizentro-retention-local.yml'
  workflow_dispatch:
jobs:
  retention:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/trizentro-retention-local.test.cjs
