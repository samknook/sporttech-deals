name: Deploy TriZentro to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/test-trizentro-official-sources.cjs'
      - 'tests/test-trizentro-rbr-registration.cjs'
      - 'tests/test-trizentro-egmond-registration.cjs'
      - 'tests/test-trizentro-quick-registration-filter.cjs'
      - 'tests/test-trizentro-direct-registration-cards.cjs'
      - 'tests/test-trizentro-registration-status-cards.cjs'
      - 'tests/test-trizentro-organizer-daily-csv.cjs'
      - 'tests/test-trizentro-organizer-comparison.cjs'
      - 'tests/test-trizentro-organizer-summary.cjs'
      - 'tests/test-trizentro-event-save.cjs'
      - 'tests/test-trizentro-registration-radar.cjs'
      - 'tests/test-trizentro-referrer-attribution.cjs'
      - 'tests/test-trizentro-legacy-canonical.cjs'
      - 'tests/test-trizentro-event-share.cjs'
      - 'tests/test-trizentro-major-race-images.cjs'
      - 'tests/test-trizentro-seo.cjs'
      - 'scripts/build-trizentro-event-pages.cjs'
      - 'scripts/build-trizentro-platform-shell.cjs'
      - 'scripts/build-trizentro-seo-hubs.cjs'
      - '.github/trizentro-domain.json'
      - '.github/workflows/deploy-trizentro-pages.yml'
  pull_request:
    paths:
      - '.github/workflows/deploy-trizentro-pages.yml'
      - '.github/trizentro-domain.json'
      - 'scripts/build-trizentro-event-pages.cjs'
      - 'scripts/build-trizentro-platform-shell.cjs'
      - 'scripts/build-trizentro-seo-hubs.cjs'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trizentro-pages-${{ github.event_name == 'pull_request' && 'check' || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical race detail pages
        env:
          TRIZENTRO_DOMAIN_CONFIRMED: 'true'
        run: node scripts/build-trizentro-event-pages.cjs
      - name: Build official sport and regional search landing pages
        run: node scripts/build-trizentro-seo-hubs.cjs
      - name: Build integrated Events, Organizers and Season routes
        run: node scripts/build-trizentro-platform-shell.cjs
      - name: Verify official event sources and retention regressions
        shell: bash
        run: |
          # Run every check even when one fails, then block deployment if needed.
          set -uo pipefail
          failed=0
          for test_file in \
            tests/test-trizentro-official-sources.cjs \
            tests/test-trizentro-rbr-registration.cjs \
            tests/test-trizentro-egmond-registration.cjs \
            tests/test-trizentro-quick-registration-filter.cjs \
            tests/test-trizentro-direct-registration-cards.cjs \
            tests/test-trizentro-registration-status-cards.cjs \
            tests/test-trizentro-organizer-daily-csv.cjs \
            tests/test-trizentro-organizer-comparison.cjs \
            tests/test-trizentro-organizer-summary.cjs \
            tests/test-trizentro-event-save.cjs \
            tests/test-trizentro-registration-radar.cjs \
            tests/test-trizentro-referrer-attribution.cjs \
            tests/test-trizentro-legacy-canonical.cjs \
            tests/test-trizentro-event-share.cjs \
            tests/test-trizentro-major-race-images.cjs \
            tests/test-trizentro-seo.cjs; do
            echo "::group::Check $test_file"
            if node "$test_file"; then
              echo "PASS $test_file" | tee -a /tmp/trizentro-checks.txt
            else
              echo "::error file=$test_file::TriZentro regression failed"
              echo "FAIL $test_file" | tee -a /tmp/trizentro-checks.txt
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          {
            echo '## TriZentro pre-deploy checks'
            echo '~~~text'
            cat /tmp/trizentro-checks.txt
            echo '~~~'
            echo "Failures: $failed"
          } >> "$GITHUB_STEP_SUMMARY"
          echo '--- TriZentro checks summary ---'
          cat /tmp/trizentro-checks.txt
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed release checks failed; production deploy blocked."
            exit 1
          fi
      - name: Validate complete release
        run: |
          test -f docs/index.html
          test -f docs/events/index.html
          test -f docs/ontdek/hardloopwedstrijden-2027/index.html
          test -f docs/ontdek/gravel-evenementen-2027/index.html
          grep -q '/ontdek/hardloopwedstrijden-2027/' docs/sitemap.xml
          grep -q '/ontdek/gravel-evenementen-2027/' docs/sitemap.xml
          test -f docs/organisatoren/index.html
          test -f docs/raceatlas/organizer-dashboard.html
          test -f docs/raceatlas/organizer-dashboard.js
          grep -q 'id="exportDaily"' docs/raceatlas/organizer-dashboard.html
          grep -q 'id="comparisonRows"' docs/raceatlas/organizer-dashboard.html
          grep -q 'id="copySummary"' docs/raceatlas/organizer-dashboard.html
          test -f docs/raceatlas/organizer-review-admin.html
          test -f docs/raceatlas/organizer-review-admin.js
          test -f docs/events/wedstrijden/garmin-zevenheuvelenloop-2027-ra-433.html
          test -f docs/CNAME
          grep -qx 'trizentro.com' docs/CNAME
          grep -q 'organizer-dashboard.html' docs/organisatoren/index.html
          grep -q '<urlset' docs/sitemap.xml
          echo "Canonical race pages: $(find docs/events/wedstrijden -name '*.html' | wc -l)"
          echo "Pages artifact size:"
          du -sh docs
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish official domain
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify latest retention and campaign release pages on live domain
        run: |
          set -euo pipefail
          for race in rbr-rotterdam-2027-ra-214 hydro-run-bike-run-nijkerk-2027-ra-206 hydro-run-bike-run-nunspeet-2027-ra-459; do
            for attempt in $(seq 1 8); do
              code=$(curl -sSL --max-time 20 -o /tmp/tri-event -w '%{http_code}' "https://trizentro.com/events/wedstrijden/$race.html") || code=000
              if [ "$code" = 200 ] && grep -q 'id="saveRace"' /tmp/tri-event && grep -q 'data-ra-radar=' /tmp/tri-event; then break; fi
              sleep 5
            done
            test "$code" = 200
            grep -q 'id="saveRace"' /tmp/tri-event
            grep -q 'data-ra-radar=' /tmp/tri-event
          done
          curl -fsSL --retry 5 --retry-delay 5 --max-time 25 -o /tmp/tri-tracking https://trizentro.com/raceatlas/tracking.js
          grep -q 'radar_intent' /tmp/tri-tracking
          curl -fsSL --retry 5 --retry-delay 5 --max-time 25 -o /tmp/tri-admin https://trizentro.com/raceatlas/organizer-review-admin.html
          grep -q 'acquisitionOpens' /tmp/tri-admin
          grep -q 'acquisitionSaves' /tmp/tri-admin
          curl -fsSL --retry 5 --retry-delay 5 --max-time 25 -o /tmp/tri-organizer https://trizentro.com/raceatlas/organizer-dashboard.html
          grep -q 'id="exportDaily"' /tmp/tri-organizer
          curl -fsSL --retry 5 --retry-delay 5 --max-time 25 -o /tmp/tri-organizer-js https://trizentro.com/raceatlas/organizer-dashboard.js
          grep -q 'function dailyCsvRows' /tmp/tri-organizer-js
          grep -q 'function rankedOrganizerEvents' /tmp/tri-organizer-js
          grep -q 'id="comparisonRows"' /tmp/tri-organizer
          grep -q 'id="copySummary"' /tmp/tri-organizer
          grep -q 'function organizerSummaryText' /tmp/tri-organizer-js
          echo 'Verified latest release features on trizentro.com'
      - name: Verify latest calendar filters and registration statuses on production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 25 "https://trizentro.com/events/?release=${{ github.sha }}" -o /tmp/tri-calendar &&
               grep -Fq 'data-quick="registration"' /tmp/tri-calendar &&
               grep -Fq 'ra-direct-registration' /tmp/tri-calendar &&
               grep -Fq 'function registrationCardStatus(e)' /tmp/tri-calendar &&
               grep -Fq 'Inschrijving gesloten volgens bron' /tmp/tri-calendar &&
               grep -Fq 'Directe inschrijflink beschikbaar' /tmp/tri-calendar &&
               grep -Fq 'atleta.cc/e/nhIVGRx4Tk9h' /tmp/tri-calendar; then
              echo 'Latest registration filter, direct links and honest status labels live'
              exit 0
            fi
            sleep 5
          done
          echo 'Calendar release markers were not found on trizentro.com'
          exit 1
      - name: Verify official RBR registrations are live
        shell: bash
        run: |
          set -euo pipefail
          for entry in 'rbr-almere-2027-ra-219.html:rbr--tt-almere-20271786603370440' 'rbr-rotterdam-2027-ra-214.html:rbr-rotterdam-20271786625155223'; do
            file="${entry%%:*}"
            registration="${entry#*:}"
            found=0
            for attempt in $(seq 1 10); do
              if curl -fsSL --max-time 20 "https://trizentro.com/events/wedstrijden/$file?release=${{ github.sha }}" -o /tmp/tri-rbr &&
                 grep -q "$registration" /tmp/tri-rbr; then
                found=1
                break
              fi
              sleep 5
            done
            test "$found" -eq 1 || { echo "::error::Official registration not live for $file"; exit 1; }
          done
      - name: Verify race sharing is live on the custom domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            js=$(curl -fsSL --max-time 20 "https://trizentro.com/raceatlas/event-share.js?release=${{ github.sha }}" || true)
            page=$(curl -fsSL --max-time 20 "https://trizentro.com/events/wedstrijden/garmin-zevenheuvelenloop-2027-ra-433.html?release=${{ github.sha }}" || true)
            if printf '%s' "$js" | grep -q 'shareRaceStatus' &&
               printf '%s' "$page" | grep -q 'id="shareRace"' &&
               printf '%s' "$page" | grep -q 'event-share.js'; then
              echo 'Race sharing is live at trizentro.com'
              exit 0
            fi
            sleep 5
          done
          echo 'Race sharing not visible on production URLs'
          exit 1
      - name: Verify new pages served by custom domain
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "https://trizentro.com/raceatlas/organizer-dashboard.html?release=${{ github.sha }}" | grep -q 'organizer-dashboard.js' &&
               curl -fsSL --max-time 15 "https://trizentro.com/organisatoren/?release=${{ github.sha }}" | grep -q 'organizer-dashboard.html' &&
               curl -fsSL --max-time 15 "https://trizentro.com/events/?release=${{ github.sha }}" | grep -q 'TriZentro'; then
              echo "TriZentro production routes verified"
              exit 0
            fi
            sleep 5
          done
          echo "Deployment not visible yet on required production URLs"
          exit 1
