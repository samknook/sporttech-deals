name: Deploy TriZentro to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-trizentro-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trizentro-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify required website entrypoints
        run: |
          test -f docs/index.html
          test -f docs/raceatlas/index.html
          test -f docs/raceatlas/organizer-dashboard.html
          test -f docs/raceatlas/organizer-dashboard.js
          test -f docs/raceatlas/organizer-review-admin.html
          test -f docs/raceatlas/organizer-review-admin.js
          test -f docs/CNAME
          grep -q '^trizentro.com$' docs/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to custom domain
        id: deployment
        uses: actions/deploy-pages@v4
