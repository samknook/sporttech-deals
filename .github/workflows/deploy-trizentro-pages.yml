name: Deploy TriZentro to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/test-trizentro-official-sources.cjs'
      - 'tests/test-trizentro-event-save.cjs'
      - 'tests/test-trizentro-registration-radar.cjs'
      - 'tests/test-trizentro-referrer-attribution.cjs'
      - 'tests/test-trizentro-legacy-canonical.cjs'
      - 'tests/test-trizentro-event-share.cjs'
      - 'scripts/build-trizentro-event-pages.cjs'
      - 'scripts/build-trizentro-platform-shell.cjs'
      - 'scripts/build-trizentro-seo-hubs.cjs'
      - '.github/trizentro-domain.json'
      - '.github/workflows/deploy-trizentro-pages.yml'
  pull_request:
    paths:
      - '.github/workflows/deploy-trizentro-pages.yml'
      - '.github/trizentro-domain.json'
      - 'scripts/build-trizentro-event-pages.cjs'
      - 'scripts/build-trizentro-platform-shell.cjs'
      - 'scripts/build-trizentro-seo-hubs.cjs'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trizentro-pages-${{ github.event_name == 'pull_request' && 'check' || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical race detail pages
        env:
          TRIZENTRO_DOMAIN_CONFIRMED: 'true'
        run: node scripts/build-trizentro-event-pages.cjs
      - name: Build official sport and regional search landing pages
        run: node scripts/build-trizentro-seo-hubs.cjs
      - name: Build integrated Events, Organizers and Season routes
        run: node scripts/build-trizentro-platform-shell.cjs
      - name: Verify official event sources and retention regressions
        run: |
          node tests/test-trizentro-official-sources.cjs
          node tests/test-trizentro-event-save.cjs
          node tests/test-trizentro-registration-radar.cjs
          node --test tests/test-trizentro-referrer-attribution.cjs
          node --test tests/test-trizentro-legacy-canonical.cjs
          node --test tests/test-trizentro-event-share.cjs
      - name: Validate complete release
        run: |
          test -f docs/index.html
          test -f docs/events/index.html
          test -f docs/ontdek/hardloopwedstrijden-2027/index.html
          test -f docs/ontdek/gravel-evenementen-2027/index.html
          grep -q '/ontdek/hardloopwedstrijden-2027/' docs/sitemap.xml
          grep -q '/ontdek/gravel-evenementen-2027/' docs/sitemap.xml
          test -f docs/organisatoren/index.html
          test -f docs/raceatlas/organizer-dashboard.html
          test -f docs/raceatlas/organizer-dashboard.js
          test -f docs/raceatlas/organizer-review-admin.html
          test -f docs/raceatlas/organizer-review-admin.js
          test -f docs/events/wedstrijden/garmin-zevenheuvelenloop-2027-ra-433.html
          test -f docs/CNAME
          grep -qx 'trizentro.com' docs/CNAME
          grep -q 'organizer-dashboard.html' docs/organisatoren/index.html
          grep -q '<urlset' docs/sitemap.xml
          echo "Canonical race pages: $(find docs/events/wedstrijden -name '*.html' | wc -l)"
          echo "Pages artifact size:"
          du -sh docs
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish official domain
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify latest retention and campaign release pages on live domain
        run: |
          set -euo pipefail
          for race in rbr-rotterdam-2027-ra-214 hydro-run-bike-run-nijkerk-2027-ra-206 hydro-run-bike-run-nunspeet-2027-ra-459; do
            for attempt in $(seq 1 8); do
              code=$(curl -sSL --max-time 20 -o /tmp/tri-event -w '%{http_code}' "https://trizentro.com/events/wedstrijden/$race.html") || code=000
              if [ "$code" = 200 ] && grep -q 'id="saveRace"' /tmp/tri-event && grep -q 'data-ra-radar=' /tmp/tri-event; then break; fi
              sleep 5
            done
            test "$code" = 200
            grep -q 'id="saveRace"' /tmp/tri-event
            grep -q 'data-ra-radar=' /tmp/tri-event
          done
          curl -fsSL --retry 5 --retry-delay 5 --max-time 25 -o /tmp/tri-tracking https://trizentro.com/raceatlas/tracking.js
          grep -q 'radar_intent' /tmp/tri-tracking
          curl -fsSL --retry 5 --retry-delay 5 --max-time 25 -o /tmp/tri-admin https://trizentro.com/raceatlas/organizer-review-admin.html
          grep -q 'acquisitionOpens' /tmp/tri-admin
          grep -q 'acquisitionSaves' /tmp/tri-admin
          echo 'Verified latest release features on trizentro.com'
      - name: Verify race sharing is live on the custom domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            js=$(curl -fsSL --max-time 20 "https://trizentro.com/raceatlas/event-share.js?release=${{ github.sha }}" || true)
            page=$(curl -fsSL --max-time 20 "https://trizentro.com/events/wedstrijden/garmin-zevenheuvelenloop-2027-ra-433.html?release=${{ github.sha }}" || true)
            if printf '%s' "$js" | grep -q 'shareRaceStatus' &&
               printf '%s' "$page" | grep -q 'id="shareRace"' &&
               printf '%s' "$page" | grep -q 'event-share.js'; then
              echo 'Race sharing is live at trizentro.com'
              exit 0
            fi
            sleep 5
          done
          echo 'Race sharing not visible on production URLs'
          exit 1
      - name: Verify new pages served by custom domain
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "https://trizentro.com/raceatlas/organizer-dashboard.html?release=${{ github.sha }}" | grep -q 'organizer-dashboard.js' &&
               curl -fsSL --max-time 15 "https://trizentro.com/organisatoren/?release=${{ github.sha }}" | grep -q 'organizer-dashboard.html' &&
               curl -fsSL --max-time 15 "https://trizentro.com/events/?release=${{ github.sha }}" | grep -q 'TriZentro'; then
              echo "TriZentro production routes verified"
              exit 0
            fi
            sleep 5
          done
          echo "Deployment not visible yet on required production URLs"
          exit 1
