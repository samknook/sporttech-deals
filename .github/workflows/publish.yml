name: Geautoriseerde prijsfeeds controleren en optioneel publiceren
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sporttech-pages
  cancel-in-progress: false
jobs:
  prices-and-site:
    if: vars.STD_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifieer scanner
        run: python -m unittest discover -s tests -v
      - name: Importeer alleen geautoriseerde feeds
        env:
          STD_FEED_URLS: ${{ secrets.STD_FEED_URLS }}
        run: python app/build.py
      - name: Sla alleen openbare prijsgegevens op
        run: |
          git config user.name "sporttech-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update geautoriseerde prijzen"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
