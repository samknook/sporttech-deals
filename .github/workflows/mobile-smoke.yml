name: TriZentro mobile browser smoke test
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tests/mobile-smoke.cjs'
      - '.github/workflows/mobile-smoke.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/mobile-smoke.cjs'
      - '.github/workflows/mobile-smoke.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright runner
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check site on mobile-sized Chromium
        run: node tests/mobile-smoke.cjs
      - name: Upload screenshot if mobile test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trizentro-mobile-smoke-failure
          path: mobile-smoke-failure.png
          if-no-files-found: ignore
