name: Publiceer introductiewebsite voor Daisycon

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/koopgids.html'
      - 'docs/transparantie.html'
      - 'docs/site.css'
      - 'docs/fietscomputer-triatlon.html'
      - 'docs/fietscomputer-aanbieding.html'
      - 'docs/70-3-eindtijd-calculator.html'
      - 'docs/race-planner.html'
      - 'docs/race-planner-core.js'
      - 'docs/race-planner-app.js'
      - 'tests/test_race_planner.cjs'
      - 'docs/robots.txt'
      - 'docs/sitemap.xml'
      - 'docs/.nojekyll'
      - '.github/workflows/pages-intro.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sporttech-intro-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Haal introductiepagina's op
        uses: actions/checkout@v4
      - name: Controleer introductie-inhoud
        run: |
          test -s docs/index.html
          test -s docs/koopgids.html
          test -s docs/transparantie.html
          test -s docs/site.css
          test -s docs/70-3-eindtijd-calculator.html
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('docs/70-3-eindtijd-calculator.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert len(scripts)==1, 'Racecalculator moet precies één lokaal script hebben'
          assert '21.0975' in scripts[0] and '90/bike' in scripts[0], '70.3 afstanden ontbreken'
          Path('/tmp/sporttech-70-3-calculator.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/sporttech-70-3-calculator.js
          test -s docs/race-planner.html
          test -s docs/race-planner-core.js
          test -s docs/race-planner-app.js
          node --check docs/race-planner-core.js
          node --check docs/race-planner-app.js
          node --test tests/test_race_planner.cjs
          test -s docs/fietscomputer-triatlon.html
          test -s docs/fietscomputer-aanbieding.html
          test -s docs/sitemap.xml
          test -s docs/robots.txt
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta=[]
              def handle_starttag(self, tag, attrs):
                  if tag=="meta": self.meta.append(dict(attrs))
          p=Check()
          p.feed(Path("docs/index.html").read_text(encoding="utf-8"))
          expected_name="3045ec1a300a1b5"
          expected_value="e43119facc31c6d54302cec101a02834"
          assert any(m.get("name")==expected_name and m.get("content")==expected_value for m in p.meta), "Daisycon verificatiemetatag ontbreekt."
          print("Introductiepagina en Daisycon-tag gecontroleerd.")
          PY
      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5
      - name: Introductiesite uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Introductiesite publiceren
        id: deployment
        uses: actions/deploy-pages@v4
