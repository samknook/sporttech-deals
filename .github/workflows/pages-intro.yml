name: Publiceer introductiewebsite voor Daisycon

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/koopgids.html'
      - 'docs/transparantie.html'
      - 'docs/site.css'
      - 'docs/fietscomputer-triatlon.html'
      - 'docs/fietscomputer-aanbieding.html'
      - 'docs/70-3-eindtijd-calculator.html'
      - 'docs/race-planner.html'
      - 'docs/triathlon-calculator.html'
      - 'docs/triathlon-calculator-app.js'
      - 'docs/triathlon.css'
      - 'docs/race-planner-core.js'
      - 'docs/race-planner-app.js'
      - 'tests/test_race_planner.cjs'
      - 'docs/robots.txt'
      - 'docs/sitemap.xml'
      - 'docs/.nojekyll'
      - '.github/workflows/pages-intro.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sporttech-intro-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Haal introductiepagina's op
        uses: actions/checkout@v4
      - name: Controleer introductie-inhoud
        run: |
          test -s docs/index.html
          test -s docs/koopgids.html
          test -s docs/transparantie.html
          test -s docs/site.css
          test -s docs/70-3-eindtijd-calculator.html
          test -s docs/triathlon-calculator.html
          test -s docs/triathlon.css
          test -s docs/triathlon-calculator-app.js
          node --check docs/triathlon-calculator-app.js
          python - <<'PY'
          from pathlib import Path
          pages={
              'docs/race-planner.html':['id="distance-selector"','id="custom-distances"','id="timeline"','triathlon.css'],
              'docs/triathlon-calculator.html':['id="distance-selector"','id="custom-distances"','id="time-total"','triathlon-calculator-app.js'],
              'docs/index.html':['href="race-planner.html"','href="triathlon-calculator.html"','name="3045ec1a300a1b5"'],
              'docs/70-3-eindtijd-calculator.html':['http-equiv="refresh"','triathlon-calculator.html?distance=half']
          }
          for file, snippets in pages.items():
              html=Path(file).read_text(encoding='utf-8')
              for snippet in snippets:
                  assert snippet in html, f'{file}: {snippet} ontbreekt'
          print('Alle nieuwe racepagina’s en legacy-redirect gecontroleerd.')
          PY
          test -s docs/race-planner.html
          test -s docs/race-planner-core.js
          test -s docs/race-planner-app.js
          node --check docs/race-planner-core.js
          node --check docs/race-planner-app.js
          node --test tests/test_race_planner.cjs
          test -s docs/fietscomputer-triatlon.html
          test -s docs/fietscomputer-aanbieding.html
          test -s docs/sitemap.xml
          test -s docs/robots.txt
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta=[]
              def handle_starttag(self, tag, attrs):
                  if tag=="meta": self.meta.append(dict(attrs))
          p=Check()
          p.feed(Path("docs/index.html").read_text(encoding="utf-8"))
          expected_name="3045ec1a300a1b5"
          expected_value="e43119facc31c6d54302cec101a02834"
          assert any(m.get("name")==expected_name and m.get("content")==expected_value for m in p.meta), "Daisycon verificatiemetatag ontbreekt."
          print("Introductiepagina en Daisycon-tag gecontroleerd.")
          PY
      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5
      - name: Introductiesite uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Introductiesite publiceren
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Controleer LIVE website, planner en Daisycon-metatag
        env:
          STD_PUBLIC_SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          from urllib.parse import urljoin
          base = os.environ['STD_PUBLIC_SITE']
          expected = {
              '': ['name="3045ec1a300a1b5"', 'content="e43119facc31c6d54302cec101a02834"', 'href="race-planner.html"'],
              'triathlon-calculator.html': ['id="distance-selector"', 'triathlon-calculator-app.js', 'triathlon.css'],
              'triathlon-calculator-app.js': ['changeDistance', 'RacePlannerCore'],
              'triathlon.css': ['.distance-selector', '.tri-split-visual'],
              '70-3-eindtijd-calculator.html': ['triathlon-calculator.html?distance=half'],
              'race-planner.html': ['id="timeline"', 'race-planner-core.js', 'race-planner-app.js'],
              'race-planner-core.js': ['RacePlannerCore', 'SWIM_METERS'],
              'race-planner-app.js': ['download-plan', 'print-plan'],
          }
          errors=[]
          for attempt in range(1,9):
              errors=[]
              for path, fragments in expected.items():
                  url=urljoin(base, path)
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'SportTechDealsSiteCheck/1.0'}),timeout=15) as response:
                          content=response.read(150000).decode('utf-8')
                      missing=[part for part in fragments if part not in content]
                      if missing: errors.append(f'{path or "home"}: ontbreekt {missing}')
                  except Exception as exc:
                      errors.append(f'{path or "home"}: {type(exc).__name__}: {exc}')
              if not errors:
                  print(f'Publieke site gecontroleerd na poging {attempt}: {base}')
                  break
              print(f'Poging {attempt}: {errors}')
              if attempt<8:time.sleep(6)
          if errors:raise SystemExit('LIVE sitecontrole mislukt: '+str(errors))
          PY
