name: TriZentro gravel discovery
on:
  pull_request:
    paths:
      - 'docs/raceatlas/index.html'
      - 'tests/gravel-discovery-nov20.test.cjs'
      - '.github/workflows/gravel-discovery-nov20.yml'
jobs:
  official-gravel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/gravel-discovery-nov20.test.cjs
      - name: Build full canonical race pages
        run: |
          TRIZENTRO_DOMAIN_CONFIRMED=true node scripts/build-trizentro-event-pages.cjs
          node scripts/build-trizentro-platform-shell.cjs
          test -f docs/events/wedstrijden/gravel-one-fifty-2027-ra-455.html
          test -f docs/events/wedstrijden/marly-grav-race-2027-ra-458.html
